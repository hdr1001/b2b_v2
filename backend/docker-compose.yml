version: '3.4'

services:
  b2bapiv2:
    image: b2bapiv2

    build:
      context: node/src
      dockerfile: ../Dockerfile
      args:
        NODE_ENV: ${NODE_ENV}

    environment:
      API_SERVER_PORT: ${API_SERVER_PORT}

      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}

      PG_HOST: ${PG_HOST}
      PG_DATABASE: ${PG_DATABASE}
      PG_PORT: ${PG_PORT}

    ports:
      - ${API_SERVER_PORT}:${API_SERVER_PORT}
